    <script>
      // Ensure window.fetch has both getter and setter so that third-party scripts, polyfills,
      // or browser extensions never throw "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return customFetch; },
              set: function(fn) { customFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() { return customFetch; },
                  set: function(fn) { customFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
